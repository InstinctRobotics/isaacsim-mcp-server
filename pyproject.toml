[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isaacsim-mcp-server"
dynamic = ["version"]
description = "Control NVIDIA Isaac Sim 5.1.0 - 6.2.0 (PhysX + Newton) through MCP -- 42 tools for scene management, robot control, sensors, and simulation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "omni-mcp" },
    { name = "whats2000" },
]
keywords = ["mcp", "isaac-sim", "robotics", "simulation", "nvidia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Both bounds are load-bearing, and they fail in opposite directions.
    #   >= 2     renamed FastMCP to MCPServer, so an unbounded spec made every
    #            `pip install` of this package fail at import. Loud.
    #   < 1.3.0  FastMCP.__init__(self, name=None, **settings) swallows
    #            `instructions=`, so the server starts, serves all 42 tools and
    #            silently loses the whole agent contract. Measured against the
    #            built wheel: 1.2.0 drops it, 1.3.0 keeps it (3546 chars).
    # 1.9.0 sits deliberately above the 1.3.0 floor: it is the oldest version
    # exercised end to end here, and for a published package being stricter
    # than necessary is the safe direction.
    "mcp[cli]>=1.9.0,<2",
]

[dependency-groups]
dev = [
    "pre-commit",
    "ruff==0.16.1",  # keep in sync with CI and .pre-commit-config.yaml
    "pytest",
]

[project.urls]
Homepage = "https://github.com/whats2000/isaacsim-mcp-server"
Repository = "https://github.com/whats2000/isaacsim-mcp-server"
Issues = "https://github.com/whats2000/isaacsim-mcp-server/issues"

[project.scripts]
isaacsim-mcp-server = "isaac_mcp.server:main"

[tool.hatch.version]
path = "isaac_mcp/__init__.py"

[tool.pytest.ini_options]
pythonpath = ["isaac.sim.mcp_extension"]

[tool.hatch.build.targets.sdist]
include = ["isaac_mcp/"]

[tool.hatch.build.targets.wheel]
packages = ["isaac_mcp"]
